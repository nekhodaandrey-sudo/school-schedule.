
<!DOCTYPE html>
<html lang="be">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10172b">
<title>Расклад</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 padding:22px 18px 40px;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:var(--tg-theme-text-color,#fff);
 background:
 radial-gradient(ellipse at 10% 5%,#5267d8 0%,transparent 42%),
 radial-gradient(ellipse at 90% 30%,#7b45b4 0%,transparent 38%),
 radial-gradient(ellipse at 50% 90%,#126b91 0%,transparent 40%),
 #101525;
 background-attachment:fixed;
}
body:before{
 content:"";
 position:fixed;
 inset:0;
 background:linear-gradient(135deg,#ffffff08,#ffffff00 40%,#ffffff05);
 pointer-events:none;
}
.container{max-width:500px;margin:auto}
.glass{
 background:rgba(255,255,255,.09);
 border:1px solid rgba(255,255,255,.17);
 box-shadow:0 8px 32px rgba(0,0,0,.15),inset 0 1px 1px #ffffff22;
 backdrop-filter:blur(24px);
 -webkit-backdrop-filter:blur(24px);
 border-radius:24px;
}
.header{padding:24px;margin-bottom:22px}
.header .small{opacity:.7;font-size:13px}
.header h1{font-size:28px;margin:9px 0}
.header p{opacity:.65;margin:0;font-size:14px}
.days{
 display:flex;gap:9px;overflow-x:auto;
 padding:4px 2px 12px;
 scrollbar-width:none;
}
.days::-webkit-scrollbar{display:none}
.day{
 flex:1;min-width:55px;
 border:1px solid #ffffff20;
 background:#ffffff0b;
 color:white;padding:13px 10px;
 border-radius:18px;
 font-size:14px;
 backdrop-filter:blur(20px);
}
.day.active{
 background:linear-gradient(135deg,#8aa8ff55,#a16bff55);
 border:1px solid #ffffff55;
 box-shadow:0 4px 18px #7d68ff30;
}
.label{
 margin:18px 5px 14px;
 font-size:13px;letter-spacing:1.5px;
 opacity:.7;text-transform:uppercase;
}
.lesson{
 display:flex;align-items:center;
 gap:14px;padding:17px;
 margin-bottom:11px;
 animation:appear .25s ease;
}
.num{
 width:42px;height:42px;
 flex-shrink:0;
 display:flex;align-items:center;justify-content:center;
 border-radius:15px;
 background:linear-gradient(135deg,#8ba7ff55,#bc8cff40);
 border:1px solid #ffffff22;
 font-size:15px;font-weight:600;
}
.subject{font-size:15px;font-weight:550;line-height:1.35}
@keyframes appear{
 from{opacity:0;transform:translateY(7px)}
 to{opacity:1;transform:translateY(0)}
}
.footer{text-align:center;font-size:12px;opacity:.5;margin-top:25px}
</style>
</head>

<body>
<div class="container">

<div class="glass header">
 <div class="small">Школьны памочнік</div>
 <h1>📚 Расклад</h1>
 <p>Твой навучальны тыдзень</p>
</div>

<div class="days" id="days"></div>
<div class="label" id="dayLabel"></div>
<div id="schedule"></div>

<div class="footer">Расклад урокаў</div>

</div>

<script>
const tg=window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const data={
"Панядзелак":[
"Геаграфія",
"Сусветная гісторыя",
"Мастацтва",
"Матэматыка",
"Біялогія",
"Англійская мова"
],
"Аўторак":[
"Працоўнае навучанне",
"Беларуская літаратура",
"Фізіка",
"Фізічная культура і здароўе",
"Матэматыка",
"Англійская мова",
"Факультатыў"
],
"Серада":[
"Руская літаратура",
"Руская мова",
"Гісторыя Беларусі",
"Біялогія",
"Матэматыка",
"Англійская мова",
"Хімія"
],
"Чацвер":[
"Хімія",
"Інфарматыка",
"Беларуская літаратура",
"Беларуская мова",
"Матэматыка",
"Руская мова",
"Фізічная культура і здароўе",
"Факультатыў"
],
"Пятніца":[
"Фізічная культура і здароўе",
"Беларуская мова",
"Матэматыка",
"Інфарматыка",
"Геаграфія",
"Фізіка"
]
};

let current="Панядзелак";

function renderDays(){
 document.getElementById("days").innerHTML=
 Object.keys(data).map(day=>`
 <button class="day ${day===current?'active':''}"
 onclick="changeDay('${day}')">
 ${day.slice(0,2)}
 </button>
 `).join("");
}

function render(){
 document.getElementById("dayLabel").textContent=current;
 document.getElementById("schedule").innerHTML=
 data[current].map((subject,i)=>`
 <div class="glass lesson">
  <div class="num">${i+1}</div>
  <div class="subject">${subject}</div>
 </div>
 `).join("");
}

function changeDay(day){
 current=day;
 renderDays();
 render();
}

renderDays();
render();
</script>
</body>
</html>
